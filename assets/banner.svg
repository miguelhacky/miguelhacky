<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Miguel Fajardo — Desarrollador de software junior</title>
  <desc id="bannerDesc">Banner oscuro con el nombre Miguel Fajardo, su rol como desarrollador de software junior, su formación ADSO en el SENA y su ubicación en Colombia.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060e"/>
      <stop offset="0.55" stop-color="#0a1122"/>
      <stop offset="1" stop-color="#070a16"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#7c3aed"/>
      <stop offset="0.75" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="0.55" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>

    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <ellipse cx="1010" cy="10" rx="380" ry="250" fill="url(#glowViolet)"/>
  <ellipse cx="90" cy="310" rx="330" ry="210" fill="url(#glowBlue)"/>

  <rect x="72" y="76" width="4" height="156" rx="2" fill="url(#accent)"/>

  <text x="100" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3.5" fill="#8ea3c0">// DESARROLLADOR DE SOFTWARE</text>

  <text x="98" y="174" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1" fill="url(#nameFill)">Miguel Fajardo</text>

  <text x="100" y="220" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" fill="#93a4bd">ADSO · SENA   ·   Colombia   ·   Aprendizaje continuo</text>

  <g>
    <rect x="812" y="86" width="316" height="128" rx="14" fill="#0b1220" stroke="#1f2b45" stroke-width="1.5"/>
    <circle cx="836" cy="110" r="4.5" fill="#f87171"/>
    <circle cx="852" cy="110" r="4.5" fill="#fbbf24"/>
    <circle cx="868" cy="110" r="4.5" fill="#34d399"/>
    <text x="836" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7dd3fc">miguel@dev ~ %</text>
    <text x="966" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e2e8f0">whoami</text>
    <text x="836" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#94a3b8">software developer</text>
    <text x="836" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#a78bfa">js · ts · python · sql</text>
  </g>

  <rect x="0" y="297" width="1200" height="3" fill="url(#accent)"/>
</svg>
